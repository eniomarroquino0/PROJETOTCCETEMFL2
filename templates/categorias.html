{% extends "base.html" %}
{% block conteudo %}
<div class="topo">
  <h1>Categorias</h1>
  <a class="btn" href="{{ url_for('nova_categoria') }}">Nova categoria</a>
</div>
{% if cats %}
<div class="rolagem"><table>
  <tr><th>Nome</th><th>Descrição</th><th></th></tr>
  {% for c in cats %}
  <tr>
    <td>{{ c.nome }}</td>
    <td>{{ c.descricao or '' }}</td>
    <td class="acoes">
      <a href="{{ url_for('alterar_categoria', id=c.id) }}">Editar</a>
      <form method="post" action="{{ url_for('apagar_categoria', id=c.id) }}" onsubmit="return confirm('Excluir esta categoria?')">
        <button class="link">Excluir</button></form>
    </td>
  </tr>
  {% endfor %}
</table></div>
{% else %}
<p>Nenhuma categoria cadastrada.</p>
{% endif %}
{% endblock %}
